name: grid_ceiling_calculator
description: A Flutter app for calculating grid ceiling T-channel placements and material requirements
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  path_provider: ^2.1.4
  flutter_compass: ^0.8.1
  easy_floor:
    path: packages/easy_floor
  pdf: ^3.12.0
  printing: ^5.14.3
  # pdf 3.12 uses archive <4.1; image 4.11 requires a newer archive API.
  image: '>=4.10.1 <4.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/inside /
